[project]
name = "ai-hub-backend"
version = "0.1.0"
description = "AI Hub platform backend — FastAPI modular monolith foundation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.4,<3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
