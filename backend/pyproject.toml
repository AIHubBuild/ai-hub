[project]
name = "ai-hub-backend"
version = "0.1.0"
description = "AI Hub platform backend — FastAPI modular monolith foundation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "pyjwt>=2,<3",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "langgraph>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "pypdf>=4.2,<7.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.9,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
